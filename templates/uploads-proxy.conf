location ~ ^/wp-content/uploads/(.*) {
	try_files $uri $uri/ @uploadsproxy;
}

location @uploadsproxy {
	resolver 1.1.1.1 8.8.8.8 ipv6=off;
	resolver_timeout 5s;
	proxy_set_header Host {{PROD_HOST}};
	proxy_ssl_server_name on;
	proxy_ssl_name {{PROD_HOST}};
	proxy_http_version 1.1;
	proxy_pass https://{{PROD_HOST}}/wp-content/uploads/$1$is_args$args;
}
