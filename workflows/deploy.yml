# A push to `staging` deploys the site's own plugins to the staging site, a push to `main`
# to production; the server paths are in hosting/site.conf.
# "[dry run]" in the last commit message, or "Run workflow" (dry run by default),
# only lists what would change.
# This file is a copy of tools/workflows/deploy.yml (wp-site-tools). The deploy stops when
# the two differ: change it there, then copy it here.
name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would change
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Check this workflow matches the pinned tools
        run: |
          if ! cmp -s .github/workflows/deploy.yml tools/workflows/deploy.yml; then
            echo "::error::.github/workflows/deploy.yml differs from tools/workflows/deploy.yml. Copy it from tools/ and commit; nothing was deployed."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, simplexml
          tools: none

      - run: npm ci

      - name: Deploy
        env:
          DEPLOY_SSH: ${{ secrets.DEPLOY_SSH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DRY_RUN: ${{ (inputs.dry_run || contains(github.event.head_commit.message, '[dry run]')) && '--dry-run' || '' }}
        run: |
          if [ -z "$DEPLOY_SSH" ] || [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Deploy secrets are not set; nothing was deployed." >&2
            exit 1
          fi
          . hosting/site.conf
          case "$GITHUB_REF_NAME" in
            main) target=${PROD_ROOT:-} ;;
            staging) target=${STAGING_ROOT:-} ;;
            *) echo "No deploy target for branch $GITHUB_REF_NAME." >&2; exit 1 ;;
          esac
          if [ -z "$target" ]; then
            echo "hosting/site.conf has no server path for $GITHUB_REF_NAME; nothing was deployed." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          tools/deploy.sh "$target" $DRY_RUN
